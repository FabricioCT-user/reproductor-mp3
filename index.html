<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reproductor MP3</title>
  <meta name="theme-color" content="#0e1015">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" id="backdrop"></div>

  <main class="player" id="dropzone">
    <section class="deck">
      <div class="cover" id="cover">
        <span class="cover-placeholder">♪</span>
        <div id="lyrics" class="lyrics" hidden>
          <div id="lyrics-body" class="lyrics-body"></div>
          <div class="lyrics-actions">
            <label class="link-btn">Cargar .lrc<input type="file" id="lrc-input" accept=".lrc,.txt" hidden></label>
            <button id="lyrics-clear" class="link-btn" hidden>Quitar la cargada</button>
          </div>
        </div>
      </div>

      <div class="info">
        <div id="title" class="title">Nada en reproducción</div>
        <div id="artist" class="artist">Añade música para empezar</div>
      </div>

      <canvas id="viz" class="viz" width="600" height="80"></canvas>

      <div class="progress">
        <span id="current">0:00</span>
        <input type="range" id="seek" min="0" max="100" step="0.1" value="0" disabled aria-label="Progreso">
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="shuffle" class="icon" title="Aleatorio (S)" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button id="prev" class="icon" title="Anterior (P)">
          <svg viewBox="0 0 24 24" class="fill"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button id="play" class="icon big" title="Reproducir / Pausar (Espacio)">
          <svg viewBox="0 0 24 24" class="fill" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="next" class="icon" title="Siguiente (N)">
          <svg viewBox="0 0 24 24" class="fill"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>
        <button id="repeat" class="icon" title="Repetir (R)" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        </button>
      </div>

      <div class="volume">
        <button id="mute" class="icon small" title="Silenciar (M)">
          <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        </button>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volumen">
        <button id="lyrics-toggle" class="btn ghost eq-toggle" title="Letra (L)" aria-pressed="false">Letra</button>
        <button id="eq-toggle" class="btn ghost eq-toggle" title="Ecualizador" aria-pressed="false">EQ</button>
      </div>

      <div id="eq-panel" class="eq-panel" hidden>
        <div class="eq-head">
          <select id="eq-preset" aria-label="Preajuste"></select>
          <label class="eq-switch"><input type="checkbox" id="eq-on" checked> Activo</label>
          <button id="eq-reset" class="btn ghost" title="Poner todas las bandas a 0 dB">Restablecer</button>
        </div>
        <div id="eq-bands" class="eq-bands"></div>
        <div class="hint">Doble clic en una banda para ponerla a 0 dB</div>
      </div>
    </section>

    <section class="library">
      <div class="view-bar">
        <select id="view" aria-label="Lista"></select>
        <button id="pl-new" class="btn ghost" title="Crear una lista de reproducción">+ Lista</button>
        <button id="pl-rename" class="btn ghost" title="Renombrar lista" hidden>Renombrar</button>
        <button id="pl-delete" class="btn ghost" title="Eliminar lista" hidden>Eliminar</button>
      </div>
      <div class="library-head">
        <input type="search" id="filter" placeholder="Buscar en la biblioteca…" aria-label="Buscar">
        <label class="btn">
          + Añadir
          <input type="file" id="file-input" accept="audio/*,.flac,.m4a,.ogg,.opus,.lrc" multiple hidden>
        </label>
        <label class="btn" title="Importar todas las canciones de una carpeta (incluye subcarpetas)">
          + Carpeta
          <input type="file" id="folder-input" webkitdirectory multiple hidden>
        </label>
        <button id="clear" class="btn ghost" title="Vaciar biblioteca">Vaciar</button>
      </div>
      <ul id="playlist" class="playlist"></ul>
      <div class="hint">Arrastra archivos o carpetas a cualquier parte de la ventana · la biblioteca se guarda en este navegador</div>
    </section>
  </main>

  <div id="menu" class="menu" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <audio id="audio"></audio>
  <script src="lyrics.js"></script>
  <script src="id3.js"></script>
  <script src="tags.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
